name: Subdomain request
description: Ask for a subdomain when you cannot open a pull request yourself.
title: "[subdomain] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        A pull request is faster than an issue. See the README for how to open
        one. Use this form if you are stuck, or if you are not sure what the
        record should be.

  - type: input
    id: subdomain
    attributes:
      label: Subdomain
      description: The full name you want.
      placeholder: docs.patchworklabs.org
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Where should it point?
      description: A domain name or an IP address.
      placeholder: docs-site.netlify.app
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Who owns it?
      description: The Patchwork email of whoever we should ask when it breaks.
      placeholder: yourname@patchworklabs.org
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: What is it for?
      description: Which Patchwork project, event, or service does this serve?
    validations:
      required: true
